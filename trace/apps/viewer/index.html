<!doctype html>
<html lang="zh-CN" data-theme="dark" class="hi-app">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace 查看器</title>
    <!-- The observatory's type system (its --hd/--bd/--mn): non-blocking font load with instant system fallback. -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      // Theme before first paint: ?theme= from the observatory link, else the last choice, else dark (the observatory's default).
      (function () {
        var t = new URLSearchParams(location.search).get('theme');
        try { t = t || localStorage.getItem('hub-trace-theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
