<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Agent Architecture Hub：文档即编排的多智能体协作观察台。把编排文档里写的分工、流程和渠道，同运行后真实发生的事放在一起对照。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#06060A">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-7o1OCZ6Svd948D0uBS8sJf/zXF2NgLL7BGWd0qjedrk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Agent Architecture Hub</title>
<script>try { if (localStorage.getItem('hub.theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) { /* storage blocked */ }</script>
<link rel="stylesheet" href="hub/css/shell.css">
<link rel="stylesheet" href="hub/css/obs.css">
<link rel="stylesheet" href="hub/css/panels.css">
<link rel="stylesheet" href="hub/css/collab.css">
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>
<div class="shooting-star" style="top:15%;left:10%"></div>
<div class="shooting-star" style="top:35%;left:50%"></div>
<div class="shooting-star" style="top:65%;left:20%"></div>

<div class="app">
<header class="topbar">
  <div class="tb-brand">
    <button class="btn tb-sl-btn" id="slToggle" type="button" title="收起/展开左侧数据源栏（快捷键 B）" aria-label="收起或展开左栏">◂</button>
    <span class="tb-logo" id="tbLogo" role="img" aria-label="Logo"></span>
    <h1>AGENT ARCHITECTURE HUB</h1>
  </div>
  <div class="tb-main" id="tbMain"></div>
  <div class="tb-actions">
    <div class="tb-right">
      <div class="tb-util">
        <div class="tb-mode-switch" role="navigation" aria-label="双模式切换">
          <span class="tb-mode-item active" title="当前在观察台：协作拓扑、流程泳道和架构对账">观察台</span>
          <a class="tb-mode-item" id="consoleModeLink" href="console/" title="切换到控制台：各智能体的会话、任务板和元智能体，不带画布">控制台</a>
        </div>
        <a class="btn btn-concept" id="conceptLink" href="concept/" title="进入上游中文版概念画板：60 智能体拖拽沙盘、10 大架构模式与 Claude 钩子实验室">🎨 概念画板</a>
        <a class="btn btn-units" id="unitsLink" href="concept/#units" title="基本协作单元（概念演示预留区）：展示模型基本能力与原子级协作单元">🧩 基本协作单元</a>
        <button class="btn btn-p" id="ctrlToggle" type="button" title="反向调控与编排写回台：连接关系编辑、指令注入、Markdown Diff 预览与落盘">编排与调控</button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换明暗主题"></button>
      </div>
    </div>
  </div>
</header>
<main class="workspace">
  <aside class="side-l" id="sL" aria-label="案例与会话">
    <div class="svc-note" id="svcNote" hidden>没有连上观察台服务：这个地址只提供静态文件，会话、调用树和案例目录用不了。在仓库里运行 <code>npm start</code>，用它打印出来的地址打开。</div>
    <div class="sl-tabs" id="slTabs" role="tablist"></div>
    <div class="sl-panels" id="slPanels"></div>
  </aside>
  <div class="cv-area" id="cvA">
    <canvas id="starfield"></canvas>
    <div class="cv-grid"></div>
    <div class="cv-container"><div class="cv-transform" id="cvT"></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="zm-ctrl" aria-label="缩放">
      <button class="btn" type="button" data-zoom="in" aria-label="放大">+</button>
      <div class="zm-lbl">100%</div>
      <button class="btn" type="button" data-zoom="out" aria-label="缩小">&minus;</button>
      <button class="btn" type="button" data-zoom="reset" aria-label="复位" style="font-size:8px">&#8634;</button>
    </div>
  </div>
  <aside class="side-r" id="sR" aria-label="详情"><div id="obSr"></div></aside>
</main>
<footer class="statbar" id="statbar"></footer>
</div>
<noscript>这个页面需要 JavaScript。</noscript>

</body>
</html>
