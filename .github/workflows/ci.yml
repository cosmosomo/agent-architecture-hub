name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: trace/package-lock.json
      - run: npm ci --prefix trace
      # the node checks of the page's model and scenes, then the workspace tests
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
