name: Concept board (GitHub Pages)

# The observatory needs its local service, so it cannot run from a static host.
# The concept board is a self-contained page and can: it is published as the site.
on:
  push:
    branches: ["master"]
    paths:
      - "concept/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: concept
      - id: deployment
        uses: actions/deploy-pages@v4
